name: Flask CI/CD

on:
  pull_request:
    branches: [development, testing, main]
  push:
    branches: [development, testing, main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Flask application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check application imports and health endpoint
        run: |
          python -c "from app import app; assert app.test_client().get('/health').status_code == 200"

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'testing' && 'testing' || 'development' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Run deployment on the SSM-managed EC2 instance
        env:
          INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
        run: |
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "GitHub deployment ${GITHUB_SHA}" \
            --parameters 'commands=["cd /opt/rohithaws && sudo -u ubuntu git fetch origin main && sudo -u ubuntu git reset --hard '"$GITHUB_SHA"' && sudo -u ubuntu /opt/rohithaws/.venv/bin/pip install -r requirements.txt && sudo systemctl restart flask-app && curl --fail http://127.0.0.1/health"]' \
            --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$INSTANCE_ID"
